# DataSmart Govern Helm values。
#
# 这份默认 values 的定位是“生产形态骨架”，不是本地 Compose 的逐行翻译：
# 1. 应用层服务由本 chart 管理；
# 2. MySQL、Redis、Kafka、Nacos、Keycloak、MinIO、Neo4j、Chroma 等中间件优先接客户托管服务或成熟 chart；
# 3. 所有 Secret 只通过 existingSecret 引用，不在 values 中写明文；
# 4. 高风险 worker、dispatcher、真实工具提交继续默认关闭，避免部署即写数据。

nameOverride: ""
fullnameOverride: "datasmart-govern"

global:
  imageRegistry: ""
  imageTag: "local"
  imagePullPolicy: IfNotPresent
  existingSecret: datasmart-platform-secrets
  replicaCount: 1
  revisionHistoryLimit: 5
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0
  commonEnv:
    TZ: Asia/Shanghai
  javaEnv:
    SPRING_PROFILES_ACTIVE: prod
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    SPRING_REDIS_HOST: redis
    SPRING_DATA_REDIS_HOST: redis
  # Java services now use separate PostgreSQL schemas. Datasource connection
  # values therefore belong to individual services, not this shared block.
  javaSecretEnv: []

secretContract:
  requiredKeys:
    - postgresql-password
    - neo4j-password
    - minio-access-key
    - minio-secret-key
    - gateway-signature-secret
    - agent-runtime-internal-service-token
    - agent-approval-fact-shared-token
    - agent-post-confirm-continuation-token
    - agent-workspace-text-search-service-token
    - ai-memory-postgresql-dsn
    - datasource-credential-master-key
    - model-api-key

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

defaultResources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

ingress:
  enabled: false
  className: nginx
  host: datasmart.example.com
  path: /
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
  tls:
    enabled: true
    secretName: datasmart-gateway-tls

networkPolicy:
  enabled: false

services:
  gateway:
    enabled: true
    runtime: java
    role: ingress-and-authz-gateway
    replicaCount: 2
    port: 8080
    image:
      repository: datasmart/gateway
    env:
      DATASMART_PYTHON_AI_RUNTIME_URI: http://datasmart-govern-python-ai-runtime:8090
      DATASMART_PYTHON_AI_RUNTIME_WS_URI: ws://datasmart-govern-python-ai-runtime:8090
      DATASMART_GATEWAY_AUTHORIZATION_DECISION_ENDPOINT: http://datasmart-govern-permission-admin:8085/permissions/evaluate
      DATASMART_GATEWAY_TOOL_POLICY_ENVELOPE_REMOTE_ENABLED: "true"
      DATASMART_GATEWAY_TOOL_POLICY_ENVELOPE_EVALUATE_URL: http://datasmart-govern-permission-admin:8085/permissions/agent/tool-budget-policies/evaluate
      DATASMART_GATEWAY_OIDC_ISSUER_URI: https://idp.example.com/realms/datasmart
      DATASMART_GATEWAY_OIDC_JWK_SET_URI: https://idp.example.com/realms/datasmart/protocol/openid-connect/certs
      DATASMART_GATEWAY_PYTHON_RUNTIME_SIGNATURE_ENABLED: "true"
      DATASMART_GATEWAY_PYTHON_RUNTIME_SIGNATURE_KEY_ID: gateway-prod-v1
    secretEnv:
      - name: DATASMART_GATEWAY_PYTHON_RUNTIME_SIGNATURE_SECRET
        key: gateway-signature-secret
      # Gateway strips any browser-supplied value before injecting this token on
      # the Agent Runtime control-plane route.
      - name: DATASMART_AGENT_RUNTIME_INTERNAL_SERVICE_TOKEN
        key: agent-runtime-internal-service-token
    probe:
      readinessPath: /actuator/health
      livenessPath: /actuator/health
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi

  permission-admin:
    enabled: true
    runtime: java
    role: authorization-control-plane
    port: 8085
    image:
      repository: datasmart/permission-admin
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/datasmart_govern?currentSchema=permission_admin&ApplicationName=datasmart-permission-admin
      SPRING_DATASOURCE_USERNAME: datasmart
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      DATASMART_PERMISSION_AGENT_APPROVAL_FACT_ALLOWED_SERVICES: agent-runtime,approval-service,permission-admin
    secretEnv:
      - name: SPRING_DATASOURCE_PASSWORD
        key: postgresql-password
      - name: DATASMART_PERMISSION_AGENT_APPROVAL_FACT_SHARED_TOKEN
        key: agent-approval-fact-shared-token
    probe:
      readinessPath: /actuator/health
      livenessPath: /actuator/health

  task-management:
    enabled: true
    runtime: java
    role: task-and-outbox-control-plane
    port: 8081
    image:
      repository: datasmart/task-management
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/datasmart_govern?currentSchema=task_management&ApplicationName=datasmart-task-management
      SPRING_DATASOURCE_USERNAME: datasmart
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      DATASMART_AGENT_RUNTIME_INTERNAL_BASE_URL: http://datasmart-govern-agent-runtime:8091
      DATASMART_DATA_SYNC_INTERNAL_BASE_URL: http://datasmart-govern-data-sync:8086
      DATASMART_TASK_AGENT_TOOL_ACTION_CONTROLLED_APPROVAL_EVALUATE_URL: http://datasmart-govern-permission-admin:8085/permissions/agent/tool-action-approvals/evaluate
      DATASMART_PERMISSION_ADMIN_EVALUATE_URL: http://datasmart-govern-permission-admin:8085/permissions/evaluate
      DATASMART_TASK_AGENT_ASYNC_WORKER_ENABLED: "false"
      DATASMART_TASK_AGENT_TOOL_ACTION_CONTROLLED_SUBMIT_ENABLED: "false"
    secretEnv:
      - name: SPRING_DATASOURCE_PASSWORD
        key: postgresql-password
    probe:
      readinessPath: /actuator/health
      livenessPath: /actuator/health

  datasource-management:
    enabled: true
    runtime: java
    role: datasource-control-plane
    port: 8082
    image:
      repository: datasmart/datasource-management
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/datasmart_govern?currentSchema=datasource_management&ApplicationName=datasmart-datasource-management
      SPRING_DATASOURCE_USERNAME: datasmart
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      DATASMART_TASK_MANAGEMENT_BASE_URL: http://datasmart-govern-task-management:8081
      DATASMART_DATASOURCE_CREDENTIAL_KEY_ID: datasource-prod-v1
    secretEnv:
      - name: SPRING_DATASOURCE_PASSWORD
        key: postgresql-password
      - name: DATASMART_DATASOURCE_CREDENTIAL_MASTER_KEY
        key: datasource-credential-master-key
    probe:
      readinessPath: /actuator/health
      livenessPath: /actuator/health

  data-sync:
    enabled: true
    runtime: java
    role: data-sync-control-plane
    port: 8086
    image:
      repository: datasmart/data-sync
    env:
      # Autopilot recovery cases and trigger outbox records are durable platform
      # facts, so the data-sync control plane uses its PostgreSQL schema.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/datasmart_govern?currentSchema=data_sync&ApplicationName=datasmart-data-sync
      SPRING_DATASOURCE_USERNAME: datasmart
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      DATASMART_DATA_SYNC_DATASOURCE_CAPABILITY_BASE_URL: http://datasmart-govern-datasource-management:8082
      DATASMART_DATA_SYNC_DATASOURCE_RUN_ONCE_BASE_URL: http://datasmart-govern-datasource-management:8082
      DATASMART_DATA_SYNC_TASK_MANAGEMENT_RECEIPT_BASE_URL: http://datasmart-govern-task-management:8081
      # The default chart remains passive for bounded unattended recovery. The
      # production example enables the listener after its Kafka topic and
      # consumer group have been reviewed.
      DATASMART_DATA_SYNC_AUTOPILOT_RECOVERY_TRIGGER_ENABLED: "false"
      DATASMART_DATA_SYNC_AUTOPILOT_RECOVERY_TRIGGER_TOPIC: datasmart.agent.autopilot-recovery-trigger.v1
    secretEnv:
      - name: SPRING_DATASOURCE_PASSWORD
        key: postgresql-password
      - name: DATASMART_AGENT_RUNTIME_INTERNAL_SERVICE_TOKEN
        key: agent-runtime-internal-service-token
    probe:
      readinessPath: /actuator/health
      livenessPath: /actuator/health

  data-quality:
    enabled: true
    runtime: java
    role: data-quality-control-plane
    port: 8083
    image:
      repository: datasmart/data-quality
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/datasmart_govern?currentSchema=data_quality&ApplicationName=datasmart-data-quality
      SPRING_DATASOURCE_USERNAME: datasmart
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      DATASMART_QUALITY_DATASOURCE_READ_ONLY_SQL_BASE_URL: http://datasmart-govern-datasource-management:8082
      DATASMART_QUALITY_DATASOURCE_METADATA_VALIDATION_BASE_URL: http://datasmart-govern-datasource-management:8082
      DATASMART_QUALITY_TASK_MANAGEMENT_BASE_URL: http://datasmart-govern-task-management:8081
      DATASMART_QUALITY_TASK_MANAGEMENT_EXECUTOR_COORDINATOR_ENABLED: "false"
    secretEnv:
      - name: SPRING_DATASOURCE_PASSWORD
        key: postgresql-password
      - name: SPRING_NEO4J_AUTHENTICATION_PASSWORD
        key: neo4j-password
    probe:
      readinessPath: /actuator/health
      livenessPath: /actuator/health

  agent-runtime:
    enabled: true
    runtime: java
    role: agent-control-plane
    port: 8091
    image:
      repository: datasmart/agent-runtime
    env:
      # Agent session, approval confirmation, audit, and outbox stores must all
      # use the same PostgreSQL-backed durable control-plane boundary.
      DATASMART_AGENT_RUNTIME_DATABASE_ENABLED: "true"
      DATASMART_AGENT_RUNTIME_SESSION_STORE: postgresql
      DATASMART_AGENT_RUNTIME_APPROVAL_CONFIRMATION_STORE: postgresql
      DATASMART_AGENT_RUNTIME_AUDIT_STORE: postgresql
      DATASMART_AGENT_RUNTIME_OUTBOX_STORE: postgresql
      DATASMART_AGENT_RUNTIME_JDBC_URL: jdbc:postgresql://postgresql:5432/datasmart_govern?currentSchema=agent_runtime&ApplicationName=datasmart-agent-runtime
      DATASMART_AGENT_RUNTIME_JDBC_USERNAME: datasmart
      DATASMART_AGENT_RUNTIME_JDBC_DRIVER_CLASS_NAME: org.postgresql.Driver
      DATASMART_AGENT_RUNTIME_FLYWAY_ENABLED: "true"
      # Gateway is the only public ingress. It injects the shared service token
      # from secretEnv, while direct callers fail closed.
      DATASMART_AGENT_RUNTIME_CONTROL_PLANE_INGRESS_ENABLED: "true"
      DATASMART_PERMISSION_ADMIN_EVALUATE_URL: http://datasmart-govern-permission-admin:8085/permissions/evaluate
      DATASMART_AGENT_RUNTIME_RESUME_APPROVAL_FACT_EVALUATE_URL: http://datasmart-govern-permission-admin:8085/permissions/agent/tool-action-approvals/evaluate
      DATASMART_TASK_MANAGEMENT_AGENT_COMMAND_CONSUME_URL: http://datasmart-govern-task-management:8081/internal/agent-async-task-commands/consume
      DATASMART_AGENT_RUNTIME_ARTIFACT_MINIO_ENDPOINT: http://minio:9000
      DATASMART_AGENT_RUNTIME_TOOL_SERVICE_BASE_URLS_DATASOURCE_MANAGEMENT: http://datasmart-govern-datasource-management:8082
      DATASMART_AGENT_RUNTIME_TOOL_SERVICE_BASE_URLS_DATA_QUALITY: http://datasmart-govern-data-quality:8083
      DATASMART_AGENT_RUNTIME_TOOL_SERVICE_BASE_URLS_TASK_MANAGEMENT: http://datasmart-govern-task-management:8081
      DATASMART_AGENT_RUNTIME_TOOL_SERVICE_BASE_URLS_DATA_SYNC: http://datasmart-govern-data-sync:8086
      DATASMART_AGENT_RUNTIME_TOOL_SERVICE_BASE_URLS_PYTHON_AI_RUNTIME: http://datasmart-govern-python-ai-runtime:8090
      # A data-sync trigger is consumed only when production values explicitly
      # opt in. Topic and group remain stable across Agent Runtime replicas.
      DATASMART_AGENT_AUTOPILOT_RECOVERY_KAFKA_ENABLED: "false"
      DATASMART_AGENT_AUTOPILOT_RECOVERY_KAFKA_TOPIC: datasmart.agent.autopilot-recovery-trigger.v1
      DATASMART_AGENT_AUTOPILOT_RECOVERY_KAFKA_GROUP_ID: datasmart-agent-autopilot-recovery
      DATASMART_AGENT_RUNTIME_OUTBOX_DISPATCHER_ENABLED: "false"
      DATASMART_AGENT_RUNTIME_ASYNC_COMMAND_DISPATCHER_ENABLED: "false"
      DATASMART_AGENT_RUNTIME_ASYNC_COMMAND_DISPATCHER_ALLOWED_TOOL_CODES: workspace.text.search
      DATASMART_AGENT_RUNTIME_WORKSPACE_TEXT_SEARCH_WORKER_ENABLED: "false"
      DATASMART_AGENT_RUNTIME_WORKSPACE_TEXT_SEARCH_WORKER_BASE_URL: http://datasmart-govern-python-ai-runtime:8090
      DATASMART_AGENT_RUNTIME_WORKSPACE_TEXT_SEARCH_WORKER_RUN_PATH: /internal/agent/workspace-text/command-worker/run
      DATASMART_AGENT_RUNTIME_WORKSPACE_TEXT_SEARCH_WORKER_REPOSITORY_ROOT: /repositories/backend
      # The MCP worker client is configured but its outbox dispatcher remains
      # disabled, preserving the explicit execution boundary.
      DATASMART_AGENT_RUNTIME_MCP_DURABLE_WORKER_ENABLED: "true"
      DATASMART_AGENT_RUNTIME_MCP_DURABLE_WORKER_BASE_URL: http://datasmart-govern-python-ai-runtime:8090
      DATASMART_AGENT_RUNTIME_MCP_DURABLE_WORKER_RUN_PATH: /internal/agent/mcp/durable-worker/run
      DATASMART_AGENT_RUNTIME_MCP_DURABLE_WORKER_INCLUDE_MODEL_FEEDBACK: "true"
      DATASMART_AGENT_RUNTIME_MCP_DURABLE_WORKER_POST_TO_JAVA: "false"
      DATASMART_AGENT_RUNTIME_POST_CONFIRM_CONTINUATION_ENABLED: "true"
      DATASMART_AGENT_RUNTIME_POST_CONFIRM_CONTINUATION_BASE_URL: http://datasmart-govern-python-ai-runtime:8090
      DATASMART_AGENT_RUNTIME_POST_CONFIRM_CONTINUATION_PATH: /internal/agent/continuations/post-confirm
    secretEnv:
      - name: DATASMART_AGENT_RUNTIME_JDBC_PASSWORD
        key: postgresql-password
      - name: DATASMART_AGENT_RUNTIME_INTERNAL_SERVICE_TOKEN
        key: agent-runtime-internal-service-token
      - name: DATASMART_AGENT_APPROVAL_FACT_SHARED_TOKEN
        key: agent-approval-fact-shared-token
      - name: DATASMART_AGENT_RUNTIME_ARTIFACT_MINIO_ACCESS_KEY
        key: minio-access-key
      - name: DATASMART_AGENT_RUNTIME_ARTIFACT_MINIO_SECRET_KEY
        key: minio-secret-key
      - name: DATASMART_AGENT_WORKSPACE_TEXT_SEARCH_SERVICE_TOKEN
        key: agent-workspace-text-search-service-token
      - name: DATASMART_AGENT_RUNTIME_POST_CONFIRM_CONTINUATION_TOKEN
        key: agent-post-confirm-continuation-token
      - name: DATASMART_AGENT_RUNTIME_MCP_DURABLE_WORKER_SERVICE_ACCOUNT_TOKEN
        key: agent-runtime-internal-service-token
    probe:
      readinessPath: /actuator/health
      livenessPath: /actuator/health

  observability:
    enabled: true
    runtime: java
    role: observability-control-plane
    port: 8084
    image:
      repository: datasmart/observability
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/datasmart_govern?currentSchema=observability&ApplicationName=datasmart-observability
      SPRING_DATASOURCE_USERNAME: datasmart
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      DATASMART_OBSERVABILITY_GATEWAY_BASE_URL: http://datasmart-govern-gateway:8080
      DATASMART_OBSERVABILITY_PERMISSION_ADMIN_BASE_URL: http://datasmart-govern-permission-admin:8085
      DATASMART_OBSERVABILITY_TASK_MANAGEMENT_BASE_URL: http://datasmart-govern-task-management:8081
      DATASMART_OBSERVABILITY_DATASOURCE_MANAGEMENT_BASE_URL: http://datasmart-govern-datasource-management:8082
      DATASMART_OBSERVABILITY_DATA_SYNC_BASE_URL: http://datasmart-govern-data-sync:8086
      DATASMART_OBSERVABILITY_DATA_QUALITY_BASE_URL: http://datasmart-govern-data-quality:8083
      DATASMART_OBSERVABILITY_AGENT_RUNTIME_BASE_URL: http://datasmart-govern-agent-runtime:8091
      DATASMART_OBSERVABILITY_SELF_BASE_URL: http://datasmart-govern-observability:8084
      DATASMART_OBSERVABILITY_PYTHON_AI_RUNTIME_BASE_URL: http://datasmart-govern-python-ai-runtime:8090
    secretEnv:
      - name: SPRING_DATASOURCE_PASSWORD
        key: postgresql-password
    probe:
      readinessPath: /actuator/health
      livenessPath: /actuator/health

  python-ai-runtime:
    enabled: true
    runtime: python
    role: ai-runtime
    port: 8090
    image:
      repository: datasmart/python-ai-runtime
    env:
      DATASMART_AI_RUNTIME_MODE: production
      DATASMART_AGENT_RUNTIME_BASE_URL: http://datasmart-govern-agent-runtime:8091
      DATASMART_PERMISSION_ADMIN_BASE_URL: http://datasmart-govern-permission-admin:8085
      # Python only plans and consumes low-sensitive facts. Java remains the
      # owner of authorization, confirmation, outbox, and business side effects.
      DATASMART_DATASOURCE_MANAGEMENT_BASE_URL: http://datasmart-govern-datasource-management:8082
      DATASMART_DATA_SYNC_BASE_URL: http://datasmart-govern-data-sync:8086
      DATASMART_AGENT_RUNTIME_SPECIALIST_TURN_FACT_ENABLED: "true"
      DATASMART_AGENT_RUNTIME_SPECIALIST_TURN_FACT_FAIL_CLOSED: "true"
      DATASMART_AGENT_RUNTIME_SPECIALIST_TURN_FACT_SOURCE_SERVICE: python-ai-runtime
      DATASMART_AGENT_RUNTIME_PLAN_INGESTION_ENABLED: "true"
      DATASMART_AGENT_RUNTIME_TOOL_FEEDBACK_ENABLED: "true"
      DATASMART_AGENT_RUNTIME_SYNC_AUTO_EXECUTION_ENABLED: "false"
      DATASMART_AGENT_RUNTIME_SYNC_AUTO_EXECUTION_DRY_RUN: "false"
      DATASMART_AGENT_RUNTIME_SYNC_AUTO_EXECUTION_MAX: "5"
      DATASMART_AGENT_RUNTIME_SECOND_TURN_ENABLED: "true"
      DATASMART_AGENT_RUNTIME_EVENT_LOOP_FEEDBACK_ENABLED: "true"
      DATASMART_AGENT_DURABLE_MODEL_TOOL_MAX_TURNS: "6"
      DATASMART_AI_RUNTIME_REDIS_URL: redis://redis:6379/0
      DATASMART_AI_RUNTIME_EVENT_STORE: redis-stream
      DATASMART_AI_RUNTIME_EVENT_CHECKPOINT_STORE: redis
      DATASMART_AI_RUNTIME_EVENT_OUTBOX_STORE: redis
      DATASMART_AI_RUNTIME_EVENT_PUBLISHER: kafka
      DATASMART_AI_RUNTIME_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATASMART_AGENT_DURABLE_LOOP_STORE: redis
      DATASMART_AGENT_DURABLE_LOOP_REDIS_URL: redis://redis:6379/2
      DATASMART_AGENT_DURABLE_LOOP_TTL_SECONDS: "86400"
      # PostgreSQL stores AI memory, RAG evidence, and LangGraph checkpoints.
      # The DSNs themselves are injected from secretEnv because they include DB
      # credentials and must not be assembled in chart values.
      DATASMART_LANGGRAPH_CHECKPOINT_STORE: postgresql
      DATASMART_LANGGRAPH_CHECKPOINT_CONNECT_TIMEOUT_SECONDS: "3"
      DATASMART_LANGGRAPH_CHECKPOINT_FAIL_OPEN: "false"
      DATASMART_RAG_KNOWLEDGE_BASE: postgresql
      DATASMART_RAG_SCHEMA_CHECK_ON_STARTUP: "true"
      DATASMART_AGENT_WORKSPACE_TEXT_SEARCH_ENABLED: "false"
      DATASMART_AGENT_REPOSITORY_ROOT_ALLOWLIST: /repositories/backend,/repositories/frontend
      DATASMART_AGENT_WORKSPACE_TEXT_SEARCH_MAX_QUERY_CHARS: "256"
      DATASMART_AGENT_WORKSPACE_TEXT_SEARCH_MAX_FILES: "200"
      DATASMART_AGENT_WORKSPACE_TEXT_SEARCH_MAX_FILE_BYTES: "262144"
      DATASMART_AGENT_WORKSPACE_TEXT_SEARCH_MAX_SCAN_BYTES: "2097152"
      DATASMART_AGENT_WORKSPACE_TEXT_SEARCH_MAX_MATCHES: "40"
      DATASMART_AGENT_WORKSPACE_TEXT_SEARCH_MAX_LINE_CHARS: "800"
      DATASMART_AGENT_WORKSPACE_TEXT_SEARCH_MAX_SNIPPET_CHARS: "240"
      DATASMART_AGENT_LOOP_MAX_TOTAL_TOKENS: "65536"
      DATASMART_AGENT_LOOP_GLOBAL_TIMEOUT_SECONDS: "600"
      DATASMART_AGENT_LOOP_ESTIMATED_NEXT_TURN_TOKENS: "8192"
      DATASMART_GATEWAY_SIGNATURE_REQUIRED: "true"
      DATASMART_GATEWAY_SIGNATURE_KEY_ID: gateway-prod-v1
      DATASMART_GATEWAY_SIGNATURE_NONCE_STORE: redis
      DATASMART_GATEWAY_SIGNATURE_NONCE_REDIS_URL: redis://redis:6379/1
      DATASMART_AI_OPENAI_COMPATIBLE_BASE_URL: https://model-gateway.example.com/v1
    secretEnv:
      - name: DATASMART_AGENT_RUNTIME_INTERNAL_SERVICE_TOKEN
        key: agent-runtime-internal-service-token
      - name: DATASMART_AGENT_POST_CONFIRM_CONTINUATION_TOKEN
        key: agent-post-confirm-continuation-token
      - name: DATASMART_AGENT_WORKSPACE_TEXT_SEARCH_SERVICE_TOKEN
        key: agent-workspace-text-search-service-token
      - name: DATASMART_AI_MEMORY_POSTGRESQL_DSN
        key: ai-memory-postgresql-dsn
      - name: DATASMART_LANGGRAPH_CHECKPOINT_POSTGRESQL_DSN
        key: ai-memory-postgresql-dsn
      - name: DATASMART_RAG_POSTGRESQL_DSN
        key: ai-memory-postgresql-dsn
      - name: DATASMART_GATEWAY_SIGNATURE_SECRET
        key: gateway-signature-secret
      - name: DATASMART_AI_OPENAI_COMPATIBLE_API_KEY
        key: model-api-key
    probe:
      readinessPath: /agent/closure/readiness
      livenessPath: /health
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi
